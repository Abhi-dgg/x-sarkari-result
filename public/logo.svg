<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for the top X diagonal and graduation cap -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE33" />
      <stop offset="100%" stop-color="#EAA118" />
    </linearGradient>
  </defs>

  <!-- Deep Black Circular Background -->
  <circle cx="250" cy="250" r="246" fill="#0C0D11" />

  <!-- Center Emblem Group -->
  <g transform="translate(0, 0)">
    <!-- Graduation Cap & Student on Top of the D Loop -->
    <!-- Cap Diamond -->
    <polygon points="305,96 348,118 305,140 262,118" fill="url(#goldAccent)" />
    <!-- Tassel hanging left -->
    <path d="M272,123 L267,145 L269,146 L274,124 Z" fill="url(#goldAccent)" />
    <circle cx="268" cy="147" r="3.5" fill="url(#goldAccent)" />
    <!-- Student Head -->
    <circle cx="305" cy="162" r="16.5" fill="url(#goldAccent)" />
    <!-- Student Shoulders / Collar -->
    <path d="M280,196 C280,182 330,182 330,196 Z" fill="url(#goldAccent)" />

    <!-- Left Upper Diagonal of X (Golden Amber) -->
    <polygon points="128,145 198,145 264,242 228,266 128,145" fill="url(#goldAccent)" />

    <!-- Left Lower Diagonal of X (Crisp White) -->
    <polygon points="144,316 208,316 270,232 236,206 144,316" fill="#FFFFFF" />

    <!-- Right "D" / Loop connected to X (Crisp White) -->
    <!-- Outer boundary of loop -->
    <path d="M276,168 L246,210 L290,272 L266,316 L310,316 C368,316 405,274 405,242 C405,210 368,168 310,168 Z" fill="#FFFFFF" />
    <!-- Inner cutout of loop -->
    <path d="M294,208 C340,208 360,230 360,242 C360,254 340,276 294,276 L272,242 Z" fill="#0C0D11" />
  </g>

  <!-- Brand Typography: X SARKARI JOB -->
  <!-- "X" in Golden Amber, "SARKARI JOB" in White -->
  <g transform="translate(250, 364)" text-anchor="middle">
    <text font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="3.5">
      <tspan fill="#F5A623">X </tspan>
      <tspan fill="#FFFFFF">SARKARI JOB</tspan>
    </text>
  </g>

  <!-- Bottom Accent Divider: Line • Line -->
  <g transform="translate(150, 386)">
    <line x1="0" y1="0" x2="86" y2="0" stroke="#EAA118" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="100" cy="0" r="4.5" fill="#FFBE33" />
    <line x1="114" y1="0" x2="200" y2="0" stroke="#EAA118" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
